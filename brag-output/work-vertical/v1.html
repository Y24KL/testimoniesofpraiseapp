<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{width:1080px;height:1920px;overflow:hidden;background:#12001C;font-family:Georgia,"Times New Roman",serif;color:#fff;position:relative}.bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}.shade{position:absolute;inset:0}.gold{color:#F5C542}.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 90px}.bottom{position:absolute;left:0;right:0;bottom:200px;padding:0 90px;text-align:center}.top{position:absolute;left:0;right:0;top:200px;padding:0 90px;text-align:center}.msg{font-size:84px;line-height:1.18;text-shadow:0 4px 30px rgba(0,0,0,.6)}.glow{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(245,197,66,.35),rgba(75,0,110,.0) 45%),radial-gradient(circle at 50% 100%,#4B006E,#12001C 70%)}.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#F5C542;opacity:.7}</style></head><body><div class="glow"></div><div class="dot" style="left:160px;top:300px"></div><div class="dot" style="left:880px;top:520px;width:9px;height:9px"></div><div class="dot" style="left:300px;top:1300px;width:4px;height:4px"></div><div class="dot" style="left:820px;top:1560px"></div><div class="center"><div class="msg gold" style="font-size:96px">Every song carries a story...</div></div></body></html>
