name = "top-push-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"


[vars]
# Exact origins only (scheme + host [+ port]); no paths or trailing slashes. localhost is always allowed.
ALLOWED_ORIGINS = "http://localhost:5173,https://testimoniesofpraiseweb.onrender.com,https://top-admin.onrender.com,https://testimoniesofpraiseapp.com,testimoniesofpraiseapp.com"
BUNNY_CDN_HOSTNAME = "top-media.b-cdn.net"
BUNNY_STORAGE_ENDPOINT = "storage.bunnycdn.com"
BUNNY_STORAGE_ZONE_NAME = "top-media-storage"
FIREBASE_PROJECT_ID = "testimoniesofpraiseapp"
# Sender for verification-code emails (must be a sender verified with Resend or Brevo)
MAIL_FROM = "Testimonies of Praise <gtrusouth116@gmail.com>"
VAPID_PUBLIC_KEY = ""


# NOTE ON SECRETS:
# The Bunny Storage AccessKey is a private credential and MUST NOT be committed to git.
# Add it via Cloudflare CLI before deploying:
#   npx wrangler secret put BUNNY_STORAGE_ACCESS_KEY

[ai]
binding = "AI"

# Praxiom allows 2 chat requests in progress per account. This Durable Object is the one shared counter
# for every Worker instance (see src/praxiomGate.js). Deploying it creates the class on first deploy.
[[durable_objects.bindings]]
name = "PRAXIOM_GATE"
class_name = "PraxiomConcurrencyGate"

[[migrations]]
tag = "praxiom-gate-v1"
new_sqlite_classes = ["PraxiomConcurrencyGate"]

# Notification engine (src/notify): every run fans out due campaigns and sends due queue items. Content
# published from the admin portal also runs it at once. Switch: settings/notificationEngine.enabled = false.
[triggers]
crons = ["*/2 * * * *"]

# EMAIL VERIFICATION (6-digit codes) — see docs/EMAIL_VERIFICATION_WORKER.md
# Storage for codes and trusted devices (created with: npx wrangler kv namespace create OTP_KV)
[[kv_namespaces]]
binding = "OTP_KV"
id = "25ff69eb55b34cdea4869cad477a6977"

# Secrets (never commit them):
#    npx wrangler secret put OTP_PEPPER        (any long random string)
#    npx wrangler secret put RESEND_API_KEY    (or: npx wrangler secret put BREVO_API_KEY)
