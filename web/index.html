<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Testimonies of Praise</title>

    <!-- PWA & iOS Safari Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12001C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Testimonies" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <!-- Open Graph & Social -->
    <meta name="description" content="Watch, share, and be encouraged by real testimonies of God's faithfulness." />
    <meta property="og:title" content="Testimonies of Praise" />
    <meta property="og:description" content="Every testimony has a story. Share yours." />
    <meta property="og:image" content="/logo.png" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      :root {
        --color-bg: #12001C;
        --color-primary: #4B006E;
        --color-primary-light: #7A1FA2;
        --color-primary-dark: #2E0044;
        --color-accent: #F5C542;
        --color-surface: #1E0A2B;
        --color-card: #2A1240;
        --color-border: #3D2456;
        --color-text: #FFFFFF;
        --color-text-muted: #C9B5D9;
        --color-danger: #FF6B7F;
        --color-success: #3DDC97;
        --color-live: #FF3B4E;
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html, body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
      }

      input, textarea, button, select {
        font-family: inherit;
        user-select: text;
        -webkit-user-select: text;
      }

      #root {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        background-color: #09000e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
