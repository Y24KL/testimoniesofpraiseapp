<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T.O.P. Feature Video — End Card</title>
<!-- End card appended to the feature video (848x478 CSS px, rendered at 2x). Styled after the video's own scenes:
     lavender background, deep-purple Montserrat headings, gold accents. window.seek(t) draws local time t. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(fonts/Montserrat-500.ttf)}
@font-face{font-family:M;font-weight:600;src:url(fonts/Montserrat-600.ttf)}
@font-face{font-family:M;font-weight:700;src:url(fonts/Montserrat-700.ttf)}
@font-face{font-family:M;font-weight:800;src:url(fonts/Montserrat-800.ttf)}
:root{--bg:#f5f2fa;--ink:#2b1742;--gold:#c28b12;--body:#635a6e;--circle:#ece3f4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:848px;height:478px;overflow:hidden;background:var(--bg);font-family:M,sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
#circle{left:440px;top:50px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#efe6f7,#e9dff3 70%,#f1ebf8)}
#kicker{left:75px;top:100px;font-weight:700;font-size:10.5px;letter-spacing:.22em;color:var(--gold)}
#kicker:before{content:"";display:inline-block;width:20px;height:1.5px;background:var(--gold);vertical-align:middle;margin-right:8px}
#head{left:75px;top:122px;font-weight:800;font-size:33px;line-height:1.12;color:var(--ink);letter-spacing:-.01em}
#head span{color:var(--gold)}
#sub{left:75px;top:208px;font-weight:500;font-size:15px;line-height:1.45;color:var(--body)}
#badge{left:75px;top:262px;display:flex;align-items:center;gap:13px;padding:9px 22px 9px 9px;border-radius:16px;background:var(--ink);
  box-shadow:0 12px 30px rgba(43,23,66,.28),0 0 0 1.5px rgba(194,139,18,.55);transform-origin:0 50%}
#badge img{width:54px;height:54px;border-radius:13px;display:block}
#badge .l1{font-weight:600;font-size:11px;color:#d9cfe6;letter-spacing:.02em}
#badge .l2{font-weight:800;font-size:20px;color:#fff;line-height:1.15}
#web{left:75px;top:348px;font-weight:500;font-size:12.5px;color:var(--body)}
#web b{color:var(--ink);font-weight:700}
#qr{left:545px;top:104px;width:170px;padding:5px;border-radius:18px;background:#fff;border:4px solid #e0a82e;
  box-shadow:0 18px 40px rgba(43,23,66,.25),0 0 var(--glow,0px) rgba(224,168,46,.8)}
#qr img{display:block;width:100%;border-radius:10px}
#qrlabel{left:500px;width:260px;top:300px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--gold)}
#qrlabel div{color:var(--ink);font-size:10.5px;letter-spacing:.18em;margin-top:5px}
#top{left:503px;top:88px;width:46px;height:46px;border-radius:12px;box-shadow:0 8px 18px rgba(43,23,66,.3)}
</style>
</head>
<body>
  <div id="circle" class="abs"></div>
  <div id="kicker" class="abs">TESTIMONIES OF PRAISE</div>
  <div id="head" class="abs">Download Free<br><span>Today</span></div>
  <div id="sub" class="abs">from the LoveWorld App Store.</div>
  <div id="badge" class="abs"><img src="img/lw-appstore-logo.jpg" alt=""><div><div class="l1">Download on the</div><div class="l2">LoveWorld AppStore</div></div></div>
  <div id="web" class="abs">Also on the web: <b>testimoniesofpraiseapp.com</b></div>
  <div id="qr" class="abs"><img src="img/qr-lwappstore.png" alt=""></div>
  <img id="top" class="abs" src="img/top-icon.png" alt="">
  <div id="qrlabel" class="abs">SCAN TO DOWNLOAD<div>THE T.O.P. APP</div></div>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x) => Math.max(0, Math.min(1, x)), prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeBack = (x) => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rise(id, t, a, dy = 16) { const x = easeOut(prog(t, a, a + .6)); $(id).style.opacity = x; $(id).style.transform = `translateY(${(1 - x) * dy}px)`; }
function pop(id, t, a, from = .6) { const x = easeBack(prog(t, a, a + .55)); $(id).style.opacity = prog(t, a, a + .2); $(id).style.transform = `scale(${from + (1 - from) * x})`; }
// timings (local seconds) — keep in sync with tools/mix.py (local 0 = 59.0 s in the video; VO "Download…" 57.1 s, "Just scan…" 61.9 s = local 2.9)
window.seek = function (t) {
  const c = easeOut(prog(t, 0, .9)); $('circle').style.transform = `scale(${.85 + .15 * c})`; $('circle').style.opacity = c;
  rise('kicker', t, .25); rise('head', t, .4, 22); rise('sub', t, .7);
  pop('badge', t, 1.7, .7); rise('web', t, 2.2);
  pop('qr', t, 1.0); pop('top', t, 1.4, .3); rise('qrlabel', t, 2.9, 10);
  const pulse = t > 2.9 ? (1 + .03 * Math.sin((t - 2.9) * 5)) : 1;
  $('qr').style.transform += ` scale(${pulse})`;
  $('qr').style.setProperty('--glow', `${t > 2.9 ? 14 + 10 * Math.sin((t - 2.9) * 5) : 0}px`);
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => 0))]);
window.ready.then(() => window.seek(parseFloat(new URLSearchParams(location.search).get('t') || '0')));
</script>
</body>
</html>
