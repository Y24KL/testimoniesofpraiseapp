# Config for the worker that is actually live as top-push-relay (version 2.5.x).
# It mirrors the live bindings exactly (no Praxiom Durable Object, VAPID_PUBLIC_KEY var).
# Secrets (BREVO_API_KEY, BUNNY_STORAGE_ACCESS_KEY, FIREBASE_SERVICE_ACCOUNT, GEMINI_API_KEY,
# KINGSCHAT_API_KEY, OTP_PEPPER, PRAXIOM_API_KEY, TAVILY_API_KEY) live in Cloudflare and are kept on deploy.
# Deploy from top-admin/worker:  npx wrangler deploy -c ../worker-live/wrangler.toml
name = "top-push-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://testimoniesofpraiseweb.onrender.com,https://top-admin.onrender.com,https://testimoniesofpraiseapp.com,testimoniesofpraiseapp.com"
BUNNY_CDN_HOSTNAME = "top-media.b-cdn.net"
BUNNY_STORAGE_ENDPOINT = "storage.bunnycdn.com"
BUNNY_STORAGE_ZONE_NAME = "top-media-storage"
FIREBASE_PROJECT_ID = "testimoniesofpraiseapp"
MAIL_FROM = "Testimonies of Praise <gtrusouth116@gmail.com>"
VAPID_PUBLIC_KEY = ""

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "OTP_KV"
id = "25ff69eb55b34cdea4869cad477a6977"

[triggers]
crons = ["*/2 * * * *"]
